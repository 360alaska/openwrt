name: MR2000 LuCI NAND layout RAM test

on:
  push:
    branches:
      - mr2000-luci-nand-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib             gettext git libncurses-dev libssl-dev python3 python3-setuptools             rsync swig unzip zlib1g-dev file wget curl subversion time patch             libelf-dev libtool autoconf automake pkg-config

      - name: Install OpenWrt feeds (including LuCI)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Linksys MR2000 with LuCI, initramfs and sysupgrade
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_qualcommax|CONFIG_TARGET_ROOTFS_INITRAMFS|CONFIG_TARGET_ROOTFS_SQUASHFS)' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y

      - name: Download sources
        run: make download -j4

      - name: Compile OpenWrt firmware
        run: make -j2 V=s

      - name: Inspect resulting images
        run: |
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*mr2000*initramfs*' -print -quit)"
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*mr2000*sysupgrade*' -print -quit)"

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: MR2000-LuCI-RAM-test-DO-NOT-FLASH
          path: |
            bin/targets/qualcommax/ipq50xx/*mr2000*
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/profiles.json
          if-no-files-found: error
          retention-days: 7
 .config
          grep -q '^CONFIG_PACKAGE_luci=y

      - name: Download sources
        run: make download -j4

      - name: Compile OpenWrt firmware
        run: make -j2 V=s

      - name: Inspect resulting images
        run: |
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*mr2000*initramfs*' -print -quit)"
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*mr2000*sysupgrade*' -print -quit)"

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: MR2000-initramfs-sysupgrade-test
          path: |
            bin/targets/qualcommax/ipq50xx/*mr2000*
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/profiles.json
          if-no-files-found: error
          retention-days: 7
 .config

      - name: Download sources
        run: make download -j4

      - name: Compile OpenWrt firmware
        run: make -j2 V=s

      - name: Inspect resulting images
        run: |
          find bin/targets/qualcommax/ipq50xx -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*mr2000*initramfs*' -print -quit)"
          test -n "$(find bin/targets/qualcommax/ipq50xx -maxdepth 1 -name '*mr2000*sysupgrade*' -print -quit)"

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: MR2000-initramfs-sysupgrade-test
          path: |
            bin/targets/qualcommax/ipq50xx/*mr2000*
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/profiles.json
          if-no-files-found: error
          retention-days: 7
