name: MR2000 upstream main firmware

on:
  push:
    branches:
      - mr2000-upstream-main-build-20261015
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record upstream source revision
        run: |
          git rev-parse HEAD
          git log -1 --oneline
          echo "Git revision: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl subversion time patch \
            libelf-dev libtool autoconf automake pkg-config

      - name: Install OpenWrt feeds (including LuCI)
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure official MR2000 device with LuCI and rescue initramfs
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_qualcommax|CONFIG_TARGET_ROOTFS_INITRAMFS|CONFIG_TARGET_ROOTFS_SQUASHFS|CONFIG_PACKAGE_luci=)' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config

      - name: Download sources
        run: make download -j4

      - name: Compile upstream MR2000 firmware
        run: make -j2 V=s

      - name: Verify images and record source
        run: |
          out=bin/targets/qualcommax/ipq50xx
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find "$out" -maxdepth 1 -name '*mr2000*initramfs*' -print -quit)"
          test -n "$(find "$out" -maxdepth 1 -name '*mr2000*sysupgrade*' -print -quit)"
          printf 'OpenWrt upstream main base: 2caedb4b48c8d25aa5d14edfb8707005b0bd95f6\nBuild commit: %s\n' "$(git rev-parse HEAD)" > "$out/MR2000-BUILD-SOURCE.txt"
          cat "$out/MR2000-BUILD-SOURCE.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload MR2000 firmware images
        uses: actions/upload-artifact@v4
        with:
          name: MR2000-Upstream-Main-LuCI-20261015
          path: |
            bin/targets/qualcommax/ipq50xx/*mr2000*
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/profiles.json
            bin/targets/qualcommax/ipq50xx/MR2000-BUILD-SOURCE.txt
          if-no-files-found: error
          retention-days: 14
