name: MR2000 build from upstream OpenWrt main

on:
  push:
    branches:
      - mr2000-upstream-main-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout official upstream OpenWrt main
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Record upstream source revision
        run: |
          git log -1 --format='Commit: %H%nDate: %cI%nSubject: %s' | tee /tmp/mr2000-upstream-revision.txt
          git remote -v
          grep -q 'define Device/linksys_mr2000' target/linux/qualcommax/image/ipq50xx.mk
          grep -q 'ipq-wifi-linksys_mr2000' target/linux/qualcommax/image/ipq50xx.mk
          grep -q 'Linksys-MR2000' target/linux/qualcommax/dts/ipq5018-mr2000.dts

      - name: Free build disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h .

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools \
            rsync swig unzip zlib1g-dev file wget curl subversion time patch \
            libelf-dev libtool autoconf automake pkg-config

      - name: Install OpenWrt feeds including LuCI
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure MR2000 with LuCI initramfs and squashfs
        run: |
          cat > .config <<'EOF'
          CONFIG_TARGET_qualcommax=y
          CONFIG_TARGET_qualcommax_ipq50xx=y
          CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_PACKAGE_luci=y
          EOF
          make defconfig
          grep -E '^(CONFIG_TARGET_qualcommax|CONFIG_TARGET_ROOTFS_INITRAMFS|CONFIG_TARGET_ROOTFS_SQUASHFS|CONFIG_PACKAGE_luci=)' .config
          grep -q '^CONFIG_TARGET_qualcommax_ipq50xx_DEVICE_linksys_mr2000=y$' .config
          grep -q '^CONFIG_TARGET_ROOTFS_INITRAMFS=y$' .config
          grep -q '^CONFIG_PACKAGE_luci=y$' .config

      - name: Download sources
        run: make download -j4

      - name: Compile MR2000 firmware
        run: make -j2 V=s

      - name: Verify images and make reproducibility notes
        run: |
          out=bin/targets/qualcommax/ipq50xx
          find "$out" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          test -n "$(find "$out" -maxdepth 1 -name '*mr2000*initramfs*' -print -quit)"
          test -n "$(find "$out" -maxdepth 1 -name '*mr2000*sysupgrade*' -print -quit)"
          mkdir -p "$out/build-info"
          cp /tmp/mr2000-upstream-revision.txt "$out/build-info/upstream-revision.txt"
          cp .config "$out/build-info/build.config"
          printf 'Built from official openwrt/openwrt main. Community CI build; not an OpenWrt release.\nVERIFY image and partition behavior before flashing. Initramfs is intended for RAM boot testing.\n' > "$out/build-info/README.txt"
          (cd "$out" && sha256sum *mr2000* > build-info/mr2000-sha256sums.txt)

      - name: Upload firmware images
        uses: actions/upload-artifact@v4
        with:
          name: MR2000-UPSTREAM-MAIN-LuCI-VERIFY-BEFORE-FLASH
          path: |
            bin/targets/qualcommax/ipq50xx/*mr2000*
            bin/targets/qualcommax/ipq50xx/sha256sums
            bin/targets/qualcommax/ipq50xx/profiles.json
            bin/targets/qualcommax/ipq50xx/build-info/**
          if-no-files-found: error
          retention-days: 7
